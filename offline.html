<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#037EF3" />
<title>Hors ligne - YouthSpeak Case</title>
<style>
  :root{ color-scheme: light }
  *{ box-sizing:border-box; margin:0 }
  body{ min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px;
    color:#fff; background:linear-gradient(160deg,#7552cc 0%,#037ef3 55%,#0cb9c1 120%) }
  .card{ max-width:440px }
  .mark{ width:66px; height:66px; border-radius:18px; background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3); display:grid; place-items:center; margin:0 auto 22px;
    font-weight:800; font-size:1.5rem; letter-spacing:.02em }
  h1{ font-size:1.8rem; margin-bottom:12px }
  p{ opacity:.95; line-height:1.65; font-size:1.05rem }
  .dot{ color:#ffc845 }
  a{ display:inline-block; margin-top:24px; background:#fff; color:#7552cc; font-weight:700;
    text-decoration:none; padding:13px 28px; border-radius:999px }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">YS<span class="dot">.</span></div>
    <h1>Tu es hors ligne</h1>
    <p>Pas de connexion pour le moment. Reconnecte-toi puis reessaie. Le YouthSpeak Case t'attend le 4 novembre 2026 a Louvain-la-Neuve.</p>
    <a href="/">Reessayer</a>
  </div>
</body>
</html>
